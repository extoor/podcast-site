# Container images (docker/Dockerfile), linux/amd64 + linux/arm64, in GHCR:
#   ghcr.io/<owner>/<repo>/{generator,gopherd,web}
# Pushed from main and from version tags; pull requests only build them. A weekly run
# rebuilds everything so the images pick up the newest Caddy and base image fixes.
# A push to main rebuilds only when something that goes into the images changed (the
# list below, without Markdown): new images make the generator take them and change the
# site's version, so docs, the chart and deploy/ must not. Pull requests always build:
# the jobs are required checks, and a check that never runs blocks the merge.
name: images

on:
  push:
    # main: the production images (latest); beta: the beta environment (tag beta)
    branches: [main, beta]
    tags: ['v*']             # path filters don't apply to tags
    paths:
      - Cargo.toml
      - Cargo.lock
      - podscan/**
      - sitegen/**
      - gopherd/**
      - web/**
      - podcasts.toml
      - caddy/**
      - docker/**
      - .github/workflows/images.yml
      - '!**/*.md'
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR with the workflow's own token
    strategy:
      fail-fast: false
      matrix:
        target: [generator, gopherd, web]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the history, for the site's version below
      # The site's version (sitegen/build.rs): the last commit that changed what goes into
      # the images (the same paths as above), so a docs-only commit or the weekly rebuild
      # doesn't change it.
      - name: Site version
        id: rev
        run: |
          echo "commit=$(git log -1 --format=%H -- Cargo.toml Cargo.lock podscan sitegen gopherd web \
            podcasts.toml caddy docker .github/workflows/images.yml ':(glob,exclude)**/*.md')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          # immutable tags (sha-…, versions, weekly-…) for deployments; latest follows main
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: GIT_COMMIT=${{ steps.rev.outputs.commit }}
          platforms: linux/amd64,linux/arm64
          pull: true             # always the newest caddy:2-alpine and base images
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
