# Checks on every push and pull request: the same as before a commit (CLAUDE.md),
# plus a scan for secrets: the repository is public.
name: ci

on:
  push:
    # beta takes commits without pull requests: its pushes are checked here
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  supply-chain:
    name: cargo audit, cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  web:
    name: inlined scripts, Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the base of a pull request, for the version check
      # textplayer's version (web/textplayer/CHANGELOG.md): one VERSION in the file, the
      # changelog's top entry is that version, and a pull request that changes the file
      # raises it
      - name: textplayer version and changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          js=web/textplayer/textplayer.js
          ver() { sed -n 's/^  const VERSION = "\([0-9]*\.[0-9]*\.[0-9]*\)";$/\1/p'; }
          new=$(ver < "$js")
          [ -n "$new" ] || { echo "::error file=$js::no semantic VERSION in $js"; exit 1; }
          top=$(sed -n 's/^## \([0-9][^ ]*\)$/\1/p' web/textplayer/CHANGELOG.md | head -1)
          [ "$top" = "$new" ] || { echo "::error::CHANGELOG.md starts with $top, textplayer.js is $new"; exit 1; }
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- "$js"; then
            old=$(git show "$BASE:$js" | ver)
            [ "$old" != "$new" ] || { echo "::error file=$js::$js changed, bump VERSION ($new)"; exit 1; }
          fi
          echo "textplayer $new"
      - name: JavaScript modules parse and can be inlined
        run: |
          for f in web/*/*.js; do
            node --check "$f"
            # sitegen inlines them into <script>: a closing tag would end the script early
            if grep -qi '</script' "$f"; then echo "$f: closing script tag" >&2; exit 1; fi
          done
      # the same Caddy as in the web image: the newest 2.x with the log plugin
      - name: Caddyfile is valid (newest Caddy)
        run: |
          docker buildx build --pull -f docker/Dockerfile --target caddy -t caddy-check --load .
          docker run --rm -v "$PWD/caddy:/etc/caddy:ro" caddy-check \
            /out/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets:
    name: no secrets in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, not only the last commit
      # gitleaks itself over every commit (the action breaks on a push that starts at the
      # root commit, and wants a license for organizations)
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts=--all --no-banner --redact --verbose

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: helm lint, render, kubeconform (with cert-manager and Traefik CRDs)
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint sh alpine/helm:3.22.1 -c '
            set -e
            helm lint --strict /deploy/helm/podcast-site -f /deploy/helm/podcast-site/ci/test-values.yaml >&2
            helm template ps /deploy/helm/podcast-site -n podcasts -f /deploy/helm/podcast-site/ci/test-values.yaml
          ' > rendered.yaml
          docker run --rm -v "$PWD:/w:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/rendered.yaml
