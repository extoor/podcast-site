# Checks on every push and pull request: the same as before a commit (CLAUDE.md),
# plus a scan for secrets: the repository is public.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  supply-chain:
    name: cargo audit, cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  web:
    name: inlined scripts, Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript modules parse and can be inlined
        run: |
          for f in web/*/*.js; do
            node --check "$f"
            # sitegen inlines them into <script>: a closing tag would end the script early
            if grep -qi '</script' "$f"; then echo "$f: closing script tag" >&2; exit 1; fi
          done
      - name: Caddyfile is valid (newest Caddy)
        run: |
          docker run --rm --pull always -v "$PWD/caddy:/etc/caddy:ro" docker.io/library/caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets:
    name: no secrets in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
