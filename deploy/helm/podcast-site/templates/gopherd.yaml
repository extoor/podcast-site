{{- if .Values.gopher.enabled }}
# gopherd on its own address (Multus annotations) and port 70 without root: the pod
# sysctl net.ipv4.ip_unprivileged_port_start=0 (namespaced, allowed as a safe sysctl).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ps.fullname" . }}-gopherd
  labels:
    {{- include "ps.labels" . | nindent 4 }}
    app.kubernetes.io/component: gopherd
spec:
  replicas: 1
  # one static address: the old pod must free it before the new one takes it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ps.selector" (list . "gopherd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ps.selector" (list . "gopherd") | nindent 8 }}
      {{- $ann := deepCopy (.Values.gopher.podAnnotations | default dict) }}
      {{- with .Values.gopher.network }}
      {{- if .enabled }}
      {{- $net := dict "name" (printf "%s-gopher" (include "ps.fullname" $)) "namespace" $.Release.Namespace "interface" .interface "ips" (list (required "gopher.network.address is required" .address)) }}
      {{- $_ := set $ann "k8s.v1.cni.cncf.io/networks" (list $net | toJson) }}
      {{- end }}
      {{- end }}
      {{- with $ann }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $pod := fromYaml (include "ps.podSpec" .) }}
      {{- $_ := set $pod.securityContext "sysctls" (list (dict "name" "net.ipv4.ip_unprivileged_port_start" "value" "0")) }}
      {{- toYaml $pod | nindent 6 }}
      containers:
        - name: gopherd
          image: {{ include "ps.image" (list . "gopherd") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen
            - {{ printf "0.0.0.0:%v" .Values.gopher.port | quote }}
            - --build
            - /site
            - --media
            - /media
            - --max-conns
            - {{ .Values.gopher.maxConns | quote }}
          ports:
            - name: gopher
              containerPort: {{ .Values.gopher.port }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.gopher.resources | nindent 12 }}
          # a real root menu must come back, not just an open port
          readinessProbe:
            exec:
              command: [/usr/local/bin/gopherd, --check, {{ printf "127.0.0.1:%v" .Values.gopher.port | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/local/bin/gopherd, --check, {{ printf "127.0.0.1:%v" .Values.gopher.port | quote }}]
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            {{- include "ps.mounts" (list . "ro") | nindent 12 }}
      volumes:
        {{- include "ps.volumes" (list .) | nindent 8 }}
{{- if .Values.gopher.network.enabled }}
---
# gopherd's own network (see gopher.network in values.yaml)
{{- $n := .Values.gopher.network }}
{{- $ipam := dict "type" "static" }}
{{- with $n.gateway }}
{{- $_ := set $ipam "routes" (list (dict "dst" "0.0.0.0/1" "gw" .) (dict "dst" "128.0.0.0/1" "gw" .)) }}
{{- end }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "ps.fullname" . }}-gopher
  labels:
    {{- include "ps.labels" . | nindent 4 }}
    app.kubernetes.io/component: gopherd
spec:
  config: {{ dict "cniVersion" "1.0.0" "type" "macvlan" "master" (required "gopher.network.master is required" $n.master) "mode" $n.mode "ipam" $ipam | toJson | quote }}
{{- end }}
{{- end }}
