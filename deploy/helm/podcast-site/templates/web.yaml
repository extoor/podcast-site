# Caddy: pages, playlists, audio; plain HTTP on 8080, TLS ends at Traefik.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ps.fullname" . }}-web
  labels:
    {{- include "ps.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "ps.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ps.selector" (list . "web") | nindent 8 }}
      annotations:
        {{- include "ps.storageChecksum" . | nindent 8 }}
    spec:
      {{- include "ps.podSpec" . | nindent 6 }}
      containers:
        - name: caddy
          image: {{ include "ps.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            # health checks only: not in the Service, so only the kubelet reaches it
            - name: health
              containerPort: 8081
          env:
            - name: TRUSTED_PROXIES
              value: {{ join " " .Values.web.trustedProxies | quote }}
            - name: LOG_PROBES
              value: {{ .Values.web.logProbes | toString | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # alive = listening; ready = the site is built (/health is 503 until then)
          readinessProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: health }
            periodSeconds: 30
          volumeMounts:
            {{- include "ps.mounts" (list . "ro") | nindent 12 }}
            - name: tmp       # Caddy's own data and config (XDG_* point here)
              mountPath: /tmp
      volumes:
        {{- include "ps.volumes" (list .) | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ps.fullname" . }}-web
  labels:
    {{- include "ps.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "ps.selector" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
