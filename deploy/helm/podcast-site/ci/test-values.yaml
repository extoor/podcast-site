# Everything switched on, for helm lint / kubeconform in CI. Addresses are documentation ones.
domain: podcasts.example.org
extraDomains: [podcasts.example.net]
gopher:
  network:
    enabled: true
    master: eth0.100
    address: 192.0.2.45/24
    gateway: 192.0.2.1
  podAnnotations:
    example.org/note: kept next to the network annotation
generator:
  rules: |
    [[podcast]]
    name = "Zebra"
networkPolicy:
  enabled: true
media:
  csi:
    mountOptions: [dir-cache-time=1h]
