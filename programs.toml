# Rules that determine an episode's program (show) for playlists/program/*.m3u8.
#
# Each [[program]] block:
#   name  — canonical program name (shown as is);
#   tags  — other spellings found in the album tag (ID3 TALB).
#           Compared ignoring case, spaces and punctuation, so
#           "MegaBeat" = "Megabeat" and "&FRIENDS" = "FRIENDS". name itself is also a variant.
#   files — file name prefixes (case-insensitive). Used for files without a tag
#           and to fix wrong tags: a file name rule wins over the tag.
#           If several prefixes match, the longest one wins.
#
# Order: file prefix → tag from tags/name → tag as is → «Без программы» (no program).
# Names that differ only in case/punctuation are merged even without rules.
# After editing: cargo run --release -p podscan

# --- Files without tags -----------------------------------------------------

